<!DOCTYPE html>
<html>
<head>
    <title>Tourism Experience Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Tourism Experience Analytics System</h1>
    <p class="subtitle">Regression • Classification • Recommendation</p>

    <div class="card">
        <h2>Enter User ID</h2>
        <input type="number" id="user_id" placeholder="Enter User ID">
        
        <div class="button-group">
            <button onclick="getRecommendations()">Get Recommendations</button>
            <button onclick="predictRating()">Predict Rating</button>
            <button onclick="predictVisitMode()">Predict Visit Mode</button>
        </div>
    </div>

    <div class="card">
        <h2>Results</h2>
        <div id="results" class="results-box">
            <p class="placeholder">Results will appear here...</p>
        </div>
    </div>

    <footer>
        <p>Internship Project • Tourism Analytics using ML & Flask</p>
    </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
